
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patotinho Ranzinza</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  background: #171717;
  font-family: sans-serif;
  color: white;
  user-select: none;
}

#duck {
  position: fixed;
  left: 35%;
  top: 45%;
  width: 125px;
  height: 120px;
  touch-action: none;
  cursor: grab;
  --dir: 1;
  animation: waddle .35s infinite alternate ease-in-out;
}

.body {
  position: absolute;
  width: 95px;
  height: 75px;
  background: #ffd83d;
  border-radius: 55% 50% 45% 45%;
  top: 25px;
  left: 10px;
  box-shadow: inset -8px -5px #e9b92d;
}

.head {
  position: absolute;
  width: 65px;
  height: 62px;
  background: #ffe15b;
  border-radius: 50%;
  top: 0;
  left: 48px;
}

.eye {
  position: absolute;
  background: #24201a;
  width: 7px;
  height: 9px;
  border-radius: 50%;
  top: 25px;
}

.eye.left { left: 17px; }
.eye.right { left: 40px; }

.brow {
  position: absolute;
  width: 17px;
  height: 5px;
  background: #49351e;
  top: 17px;
  left: 12px;
  transform: rotate(18deg);
  border-radius: 5px;
}

.brow.right {
  left: 37px;
  transform: rotate(-18deg);
}

.beak {
  position: absolute;
  top: 36px;
  left: 63px;
  width: 25px;
  height: 13px;
  background: #ff8b24;
  border-radius: 50% 50% 60% 60%;
  z-index: 2;
}

.foot {
  position: absolute;
  width: 25px;
  height: 7px;
  background: #ed8528;
  top: 96px;
  border-radius: 50%;
}

.foot.one { left: 25px; }
.foot.two { left: 75px; }

#message {
  position: absolute;
  top: -35px;
  left: 0;
  font-size: 13px;
  white-space: nowrap;
  font-weight: bold;
}

@keyframes waddle {
  from { transform: translateY(0) rotate(-4deg) scaleX(var(--dir)); }
  to { transform: translateY(5px) rotate(4deg) scaleX(var(--dir)); }
}

.angry {
  animation: rage .12s infinite alternate !important;
}

@keyframes rage {
  from { transform: rotate(-12deg) scaleX(var(--dir)); }
  to { transform: rotate(12deg) scaleX(var(--dir)); }
}

</style>
</head>

<body>

<div id="duck">
  <div id="message">Não enche. 😒</div>
  <div class="body"></div>
  <div class="head">
    <div class="brow"></div>
    <div class="brow right"></div>
    <div class="eye left"></div>
    <div class="eye right"></div>
  </div>
  <div class="beak"></div>
  <div class="foot one"></div>
  <div class="foot two"></div>
</div>

<script>
const duck = document.getElementById("duck");
const message = document.getElementById("message");

const phrases = [
  "QUE FOI?! 😠",
  "TIRA O DEDO!",
  "Estou ocupado!",
  "QUACK! 😡",
  "ME DEIXA!",
  "Isso é assédio penoso!",
  "Vai cuidar da sua vida!",
  "GRRRR!"
];

let direction = 1;
let walking = true;
let dragging = false;
let startX = 0;
let startY = 0;
let moved = false;
let lastX = 0;

function angry() {
  message.textContent =
    phrases[Math.floor(Math.random() * phrases.length)];

  duck.classList.add("angry");

  setTimeout(() => {
    duck.classList.remove("angry");
  }, 750);
}

function walk() {
  if (!walking || dragging) return;

  let x = duck.offsetLeft + direction * 3;

  if (x > window.innerWidth - 130) {
    direction = -1;
  }

  if (x < 5) {
    direction = 1;
  }

  duck.style.left = Math.max(5, Math.min(
    window.innerWidth - 130, x
  )) + "px";

  duck.style.setProperty("--dir", direction);
}

setInterval(walk, 45);

duck.addEventListener("pointerdown", (e) => {
  dragging = true;
  moved = false;
  startX = e.clientX;
  startY = e.clientY;
  lastX = e.clientX;
  duck.setPointerCapture(e.pointerId);
});

duck.addEventListener("pointermove", (e) => {
  if (!dragging) return;

  if (Math.abs(e.clientX - startX) > 5 ||
      Math.abs(e.clientY - startY) > 5) {
    moved = true;
  }

  if (moved) {
    duck.style.left = Math.max(0, Math.min(
      window.innerWidth - 125,
      duck.offsetLeft + e.clientX - lastX
    )) + "px";

    duck.style.top = Math.max(0, Math.min(
      window.innerHeight - 120,
      duck.offsetTop + e.clientY - startY
    )) + "px";

    startY = e.clientY;
    duck.style.setProperty("--dir",
      e.clientX >= lastX ? 1 : -1);
  }

  lastX = e.clientX;
});

duck.addEventListener("pointerup", () => {
  if (!moved) angry();
  dragging = false;
});

duck.addEventListener("pointercancel", () => {
  dragging = false;
});

</script>
</body>
</html>
